<title>Kebabs de Marseille en 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concept : une maquette de la métropole la nuit. La scène 3D occupe tout l'écran,
   le récit tient dans un carnet à gauche, les réglages dans une petite console à droite.
   Un seul monde visuel (nuit), assumé dans les deux thèmes. */
:root {
  --nuit: #0a111b;        /* la mer, le fond */
  --terre: #131d2a;       /* les communes */
  --panneau: rgba(13, 21, 32, 0.86);
  --trait: #2a3a4f;
  --texte: #e9edf3;
  --texte-2: #9aa7b8;
  --braise: #ffb23e;      /* les kebabs : la broche qui chauffe */
  --rose: #e0487f;        /* niveau de vie bas */
  --lagon: #3cc4d4;       /* niveau de vie haut */
  --lilas: #a58cff;       /* isochrones */
  --pousse: #7fe08f;      /* emplacements favorables */
  --f-titre: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --f-texte: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--nuit); color: var(--texte); font-family: var(--f-texte); overflow: hidden; }
#scene { position: fixed; inset: 0; }
#scene canvas { outline: none; }

.carnet, .console, .simu {
  position: fixed; z-index: 5; background: var(--panneau); border: 1px solid var(--trait);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 10px;
}
.carnet {
  top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: min(390px, calc(100vw - 32px)); max-height: calc(100% - 28px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; overflow: hidden;
}
.entete { padding: 16px 18px 12px; border-bottom: 1px solid var(--trait); }
.entete .sur { font-family: var(--f-data); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--texte-2); }
.entete h1 { font-family: var(--f-titre); font-weight: 700; font-size: 19px; line-height: 1.2; margin: 6px 0 0; text-wrap: balance; }
.entete h1 em { font-style: normal; color: var(--braise); }
.etape { padding: 14px 18px 4px; overflow-y: auto; min-height: 0; }
.etape .num { font-family: var(--f-data); font-size: 12px; color: var(--braise); }
.etape h2 { font-family: var(--f-titre); font-weight: 500; font-size: 16px; line-height: 1.3; margin: 4px 0 8px; text-wrap: balance; }
.etape p { font-size: 14px; line-height: 1.55; margin: 0 0 10px; color: #cfd7e2; }
.chiffres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 4px 0 12px; }
.chiffre { border: 1px solid var(--trait); border-radius: 8px; padding: 8px 10px; }
.chiffre b { display: block; font-family: var(--f-data); font-weight: 500; font-size: 20px; color: var(--texte); font-variant-numeric: tabular-nums; }
.chiffre span { font-size: 12px; color: var(--texte-2); line-height: 1.3; display: block; }
.chiffre.chaud b { color: var(--braise); }
.nav { display: flex; align-items: center; gap: 8px; padding: 10px 18px 14px; border-top: 1px solid var(--trait); }
.points { display: flex; gap: 5px; flex: 1; justify-content: center; }
.points button { width: 8px; height: 8px; padding: 0; border-radius: 50%; border: 0; background: var(--trait); cursor: pointer; }
.points button[aria-current="true"] { background: var(--braise); }
button.btn {
  font-family: var(--f-texte); font-size: 13px; font-weight: 500; color: var(--texte); background: transparent;
  border: 1px solid var(--trait); border-radius: 7px; padding: 7px 12px; cursor: pointer;
}
button.btn:hover { border-color: var(--texte-2); }
button.btn.plein { background: var(--braise); border-color: var(--braise); color: #1b1206; }
button:focus-visible { outline: 2px solid var(--braise); outline-offset: 2px; }
button:disabled { opacity: .35; cursor: default; }

.console {
  top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  width: 238px; padding: 12px 14px; font-size: 13px;
}
.console h3 { font-family: var(--f-data); font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--texte-2); margin: 0 0 8px; }
.console h3 + *, .legende { margin-bottom: 14px; }
.couches label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
.couches input { accent-color: var(--braise); }
.pastille { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.segment { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--trait); border-radius: 7px; overflow: hidden; }
.segment button { font: inherit; font-size: 12px; color: var(--texte-2); background: transparent; border: 0; padding: 6px 4px; cursor: pointer; }
.segment button[aria-pressed="true"] { background: #22324a; color: var(--texte); }
.legende .degrade { height: 8px; border-radius: 4px; margin: 4px 0 3px; }
.legende .bornes { display: flex; justify-content: space-between; font-family: var(--f-data); font-size: 11px; color: var(--texte-2); }
.legende p { margin: 6px 0 0; font-size: 12px; color: var(--texte-2); line-height: 1.4; }
.console .bas { display: flex; gap: 6px; }
.console .bas button { flex: 1; }

.simu {
  left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(560px, calc(100vw - 32px)); padding: 12px 16px; display: none;
}
.simu.visible { display: block; }
.simu .ligne { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.simu .etat { font-family: var(--f-data); font-size: 12px; color: var(--texte-2); flex: 1; min-width: 0; }
.simu .etat b { color: var(--texte); font-weight: 500; }
.simu svg { width: 100%; height: auto; display: block; margin-top: 8px; }
.simu svg text { font-family: var(--f-data); font-size: 10px; fill: var(--texte-2); }

.favoris { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 4px; }
.favoris button { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 8px; font: inherit; font-size: 13px;
  color: var(--texte); background: transparent; border: 1px solid var(--trait); border-radius: 6px; padding: 6px 8px; cursor: pointer; }
.favoris button:hover { border-color: var(--pousse); }
.favoris .p { font-family: var(--f-data); color: var(--pousse); font-variant-numeric: tabular-nums; }
.effets { display: grid; gap: 5px; margin: 6px 0 12px; }
.effet { display: grid; grid-template-columns: 128px 1fr 40px; align-items: center; gap: 8px; font-size: 12px; color: #cfd7e2; }
.effet .barre { position: relative; height: 8px; }
.effet .barre::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--texte-2); }
.effet .barre i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.effet .v { font-family: var(--f-data); text-align: right; font-variant-numeric: tabular-nums; }

.bulle { font-family: var(--f-texte); font-size: 13px; line-height: 1.45; }
.bulle b { font-weight: 600; }
.bulle .m { font-family: var(--f-data); color: var(--texte-2); font-size: 12px; }
.source { position: fixed; z-index: 4; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  font-family: var(--f-data); font-size: 10px; color: var(--texte-2); text-align: right; max-width: 60vw; }
#replier { display: none; }
.horloge { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--panneau); border: 1px solid var(--trait); border-radius: 10px; padding: 10px 16px 18px; width: min(420px, calc(100vw - 32px));
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.horloge .minute { display: flex; align-items: baseline; gap: 10px; }
.horloge .minute span { font-family: var(--f-titre); font-weight: 700; font-size: 34px; color: var(--lilas); font-variant-numeric: tabular-nums; }
.horloge small { font-size: 12px; color: var(--texte-2); }
.horloge .compte { font-size: 13px; color: #cfd7e2; margin: 2px 0 8px; }
.horloge .compte b { color: var(--braise); font-family: var(--f-data); font-weight: 500; }
.barre-temps { position: relative; height: 6px; background: #22324a; border-radius: 3px; }
.barre-temps i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lilas); border-radius: 3px; }
.barre-temps span { position: absolute; top: 9px; transform: translateX(-50%); font-family: var(--f-data); font-size: 10px; color: var(--texte-2); }

@media (max-width: 760px) {
  .console { display: none; width: auto; left: max(16px, env(safe-area-inset-left, 0px)); top: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .console.ouverte { display: block; z-index: 7; }
  .carnet { top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-height: 52%; }
  .carnet.replie .etape { display: none; }
  #replier { display: inline-block; }
  .simu, .horloge { bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); }
  .source { display: none; }
  .effet { grid-template-columns: 110px 1fr 36px; }
}
</style>

<div id="scene" aria-label="Scène 3D de la métropole d'Aix-Marseille-Provence"></div>

<section class="carnet" id="carnet" aria-live="polite">
  <div class="entete">
    <div class="sur">SAÉ 5.EMS.01 · Métropole Aix-Marseille-Provence</div>
    <h1>La carte des <em>kebabs</em>, en relief</h1>
  </div>
  <div class="etape" id="etape"></div>
  <div class="nav">
    <button class="btn" id="prec" type="button">Précédent</button>
    <div class="points" id="points"></div>
    <button class="btn" id="replier" type="button" aria-expanded="true">Réduire</button>
    <button class="btn plein" id="suiv" type="button">Suivant</button>
  </div>
</section>

<aside class="console" id="console">
  <h3>Relief des carreaux</h3>
  <div class="segment" role="group" aria-label="Hauteur des carreaux">
    <button type="button" id="h-pop" aria-pressed="true">Habitants</button>
    <button type="button" id="h-proba" aria-pressed="false">Modèle</button>

  <div class="legende" id="legende"></div>
  <h3>Couches</h3>

</aside>
<button class="btn" id="ouvrir-console" type="button" style="position:fixed;z-index:6;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:none">Réglages</button>

<section class="simu" id="simu" aria-label="Simulation">
  <div class="ligne">
    <button class="btn plein" id="lancer" type="button">Placer les kebabs comme la population</button>
    <div class="etat" id="etat-simu"></div>
  </div>
  <svg id="histo" viewBox="0 0 520 92" role="img" aria-label="Distance médiane à une station dans 1 000 placements au hasard, comparée aux vrais kebabs"></svg>
</section>

<div class="horloge" id="horloge" hidden>
  <div class="minute"><span id="h-min">00</span><small>min de marche depuis la gare</small></div>
  <div class="compte"><b id="h-keb">0</b> kebabs atteints sur <span id="h-tot">0</span></div>
  <div class="barre-temps"><i id="h-barre"></i><span style="left:20%">5</span><span style="left:40%">10</span><span style="left:60%">15</span></div>
</div>

<div class="source">Sources : OpenStreetMap, Insee (SIRENE, Filosofi 2019), Valhalla. Carreaux de 200 m.</div>

<script src="https://unpkg.com/deck.gl@8.9.35/dist.min.js"></script>
<script>const D=/*__DONNEES__*/null;</script>
<script>
(() => {
const {DeckGL, ColumnLayer, ScatterplotLayer, GeoJsonLayer, ArcLayer, PolygonLayer, PathLayer, TripsLayer,
       FlyToInterpolator, LightingEffect, AmbientLight, DirectionalLight} = deck;
const $ = s => document.querySelector(s);
const reduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const fmt = (x, n = 0) => Number(x).toLocaleString("fr-FR", {minimumFractionDigits: n, maximumFractionDigits: n});
const S = D.simulation;

// ---------- couleurs ----------
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const ROSE = hex("#e0487f"), ARDOISE = hex("#7d8aa0"), LAGON = hex("#3cc4d4");
const BRAISE = hex("#ffb23e"), LILAS = hex("#a58cff"), POUSSE = hex("#7fe08f"), BRAISE_FONCE = hex("#3a2a1a");
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
function couleurNiveauVie(nv) {           // 14 000 € -> rose ; 22 000 € -> ardoise ; 34 000 € -> lagon
  if (nv == null) return [70, 80, 96];
  if (nv < 22000) return mix(ROSE, ARDOISE, Math.max(0, (nv - 14000) / 8000));
  return mix(ARDOISE, LAGON, Math.min(1, (nv - 22000) / 12000));
}
const NUIT_BLEUE = hex("#1d2a46"), PERVENCHE = hex("#8fa8ff"), BLANC = hex("#f2f5ff");
function couleurProba(p) {                // probabilité du modèle : nuit -> pervenche -> blanc
  if (p == null) return [36, 44, 58];
  const t = Math.min(1, Math.sqrt(p / 0.35));
  return t < 0.7 ? mix(NUIT_BLEUE, PERVENCHE, t / 0.7) : mix(PERVENCHE, BLANC, (t - 0.7) / 0.3);
}

// ---------- état ----------
const etat = {
  relief: "pop", tourne: false, simulation: false,
  marche: false, minute: 0,
  couches: {carreaux: true, kebabs: true, stations: true, arcs: false, isochrones: false, favoris: false, zones: true,
            rames: false, pietons: false, rates: false},
};
const COUCHES = [
  ["carreaux", "Carreaux de 200 m", "linear-gradient(90deg,#e0487f,#7d8aa0,#3cc4d4)"],
  ["kebabs", "Kebabs (144)", "#ffb23e"],
  ["stations", "Gares, métro, tram", "#e9edf3"],
  ["arcs", "Kebab → station la plus proche", "linear-gradient(90deg,#ffb23e,#e9edf3)"],
  ["isochrones", "À pied de Saint-Charles", "#a58cff"],
  ["rames", "Métro et tram en mouvement", "#9fd8ff"],
  ["pietons", "Piétons sortant de Saint-Charles", "#ffe2b0"],
  ["favoris", "Emplacements favorables", "#7fe08f"],
  ["rates", "Kebabs que le modèle n'attendait pas", "#ff5d5d"],
  ["zones", "Limites des communes", "#34465e"],
];

// ---------- récit ----------
const nbMars = D.kebabs.filter(k => k.commune === "Marseille").length;
const ETAPES = [
  {titre: "Une métropole, 144 kebabs", vue: {longitude: 5.36, latitude: 43.43, zoom: 9.1, pitch: 50, bearing: -12},
   couches: {carreaux: true, kebabs: true, stations: false, arcs: false, isochrones: false, favoris: false, rames: false, pietons: false, rates: false}, relief: "pop",
   texte: [`Chaque colonne est un carreau Insee de 200 m : sa hauteur donne le nombre d'habitants, sa couleur leur niveau de vie moyen. Les colonnes dorées, plus fines, sont les kebabs que nous avons recensés en croisant OpenStreetMap et le répertoire SIRENE.`,
           `Le relief suit la population : Marseille, Aix, Aubagne, Martigues, Salon. Les kebabs, eux, ne la suivent pas : ${nbMars} des 144 sont à Marseille.`],
   chiffres: [["144", "kebabs dans la métropole", true], ["92", "communes, 1,9 M d'habitants"]]},
  {titre: "Marseille, la fracture Nord-Sud en volume", vue: {longitude: 5.395, latitude: 43.31, zoom: 11.4, pitch: 58, bearing: 24},
   couches: {carreaux: true, kebabs: true, stations: false, arcs: false, isochrones: false, favoris: false, rames: false, pietons: false, rates: false}, relief: "pop",
   texte: [`Au nord, les tours des quartiers populaires apparaissent en rose ; au sud et à l'est, les quartiers plus aisés tirent vers le bleu. Les kebabs ne se placent ni d'un côté ni de l'autre : ils se serrent au centre.`,
           `Rapporté aux habitants, le centre (1er au 6e arrondissement) compte 2,2 kebabs pour 10 000 habitants, le Nord 0,9 et le Sud et l'Est 0,45. Les deux écarts sont significatifs (test binomial exact).`],
   chiffres: [["2,2", "kebabs / 10 000 hab. au centre", true], ["0,45", "au Sud et à l'Est"]]},
  {titre: "L'hypercentre : Belsunce, Noailles, la Canebière", vue: {longitude: 5.3805, latitude: 43.2985, zoom: 13.9, pitch: 58, bearing: -32},
   couches: {carreaux: true, kebabs: true, stations: true, arcs: false, isochrones: false, favoris: false, rames: false, pietons: false, rates: false}, relief: "pop",
   texte: [`À cette échelle, on lit rue par rue. Le 1er arrondissement concentre 23 kebabs pour 37 600 habitants, soit 6,1 pour 10 000 : le taux le plus élevé de toute la métropole.`,
           `Ce sont des carreaux très denses, au niveau de vie bas, et traversés chaque jour par bien plus de monde qu'il n'y habite. Survolez une colonne dorée pour voir le kebab.`],
   chiffres: [["23", "kebabs dans le 1er arr.", true], ["6,1", "pour 10 000 habitants"]]},
  {titre: "Saint-Charles et le dicton de la gare", vue: {longitude: 5.381, latitude: 43.3005, zoom: 13.6, pitch: 50, bearing: 8},
   couches: {carreaux: false, kebabs: true, stations: true, arcs: false, isochrones: true, favoris: false, rames: true, pietons: false, rates: false}, relief: "pop",
   texte: [`Les anneaux violets montrent ce que l'on atteint à pied depuis la gare en 5, 10 et 15 minutes, calculés sur le vrai réseau de rues.`,
           `Un quart des kebabs marseillais (25 sur ${nbMars}) est à moins de 15 minutes de marche, alors que cette zone n'abrite que 7 % des habitants. Mais un seul est à moins de 5 minutes : la gare est sur une butte. C'est le quartier commerçant en contrebas qui attire les kebabs, pas le quai.`],
   chiffres: [["25", `kebabs sur ${nbMars} à moins de 15 min`, true], ["7 %", "des habitants dans cette zone"]]},
  {titre: "L'isochrone en mouvement", vue: {longitude: 5.3805, latitude: 43.2995, zoom: 14.3, pitch: 58, bearing: -20},
   couches: {carreaux: false, kebabs: true, stations: false, arcs: false, isochrones: true, favoris: false, rames: true, pietons: true, rates: false},
   relief: "pop", marche: true, tourne: true,
   texte: [`Une isochrone, c'est une carte du temps. Ici, ${D.pietons.length} piétons sortent ensemble de la gare Saint-Charles et marchent chacun vers un kebab situé à moins de 2,5 km, en suivant les vraies rues et les escaliers (itinéraires calculés par Valhalla sur OpenStreetMap). Le temps défile environ 75 fois plus vite que dans la réalité.`,
           `À 5, 10 puis 15 minutes, la terrasse violette correspondante s'allume. Avant 5 minutes, presque personne n'arrive : la gare est sur une butte et il faut d'abord descendre. Ensuite les arrivées s'enchaînent entre 10 et 15 minutes, dans Belsunce, Noailles et sur la Canebière. Pendant ce temps, les rames du métro et du tram roulent sur leurs vrais tracés.`],
   chiffres: [["1", "kebab à moins de 5 min de la gare", true], ["17", "entre 10 et 15 min"]]},
  {titre: "Le fil invisible des stations", vue: {longitude: 5.39, latitude: 43.305, zoom: 12.1, pitch: 55, bearing: -18},
   couches: {carreaux: false, kebabs: true, stations: true, arcs: true, isochrones: false, favoris: false, rames: true, pietons: false, rates: false}, relief: "pop",
   texte: [`Chaque arc relie un kebab à la gare, la station de métro ou l'arrêt de tram le plus proche. Les arcs sont courts : la plupart des kebabs se trouvent à quelques centaines de mètres d'une station.`],
   chiffres: [[`${fmt(S.reel.station_mediane_m)} m`, "distance médiane kebab → station", true],
              [`${fmt(100 * S.reel.part_500m_station)} %`, "des kebabs à moins de 500 m"]]},
  {titre: "Simulation : et si les kebabs suivaient la population ?", vue: {longitude: 5.40, latitude: 43.33, zoom: 10.6, pitch: 50, bearing: 10},
   couches: {carreaux: true, kebabs: true, stations: true, arcs: false, isochrones: false, favoris: false, rames: false, pietons: false, rates: false}, relief: "pop", simu: true,
   texte: [`Lancez la simulation : les 144 kebabs quittent leur adresse et se posent au hasard, chaque carreau ayant une chance proportionnelle à son nombre d'habitants. Revenez ensuite à la réalité pour voir la différence.`,
           `Nous avons répété ce tirage ${fmt(S.n)} fois. Dans aucun d'eux les kebabs ne sont aussi proches des stations, ni aussi groupés entre eux, que dans la réalité. Leur répartition n'est donc pas un simple reflet de la population (hypothèses H1 et H3).`],
   chiffres: [[`${fmt(S.reel.voisin_moyen_m)} m`, "entre deux kebabs voisins, en réalité", true],
              [`${fmt(S.sim_mediane.voisin_moyen_m)} m`, "s'ils suivaient la population"]]},
  {titre: "Ce que voit le modèle", vue: {longitude: 5.40, latitude: 43.31, zoom: 10.1, pitch: 55, bearing: -20},
   couches: {carreaux: true, kebabs: true, stations: false, arcs: false, isochrones: false, favoris: true, rames: false, pietons: false, rates: true}, relief: "proba",
   texte: [`Le relief montre maintenant la probabilité qu'un carreau abrite un kebab, selon notre régression logistique (densité, niveau de vie, logement social, âge, distance à une station). Le modèle distingue très bien les carreaux à kebab des autres : AUC de ${fmt(D.auc, 2)} en validation croisée.`,
           `Pourquoi ce modèle simple ? Nous l'avons comparé à deux modèles plus souples, avec le même protocole (AUC) : ${D.comparaison.map(m => `${m.modele.replace(" (retenue)", "").toLowerCase()} ${fmt(m.auc, 3)}`).join(", ")}. Le plus simple est aussi le meilleur, et c'est le seul dont on peut lire chaque effet.`,
           `Les anneaux verts sont les douze carreaux qu'il juge les plus favorables sans kebab connu : des oublis de notre base, ou des emplacements à étudier. Les anneaux rouges sont ses ratés, des kebabs qu'il n'attendait pas, en bord de mer (Ensuès, La Ciotat, le 8e arrondissement) ou en zone commerciale (Vitrolles). Il lui manque une mesure du tourisme et de l'activité, que le recensement ne donne pas.`],
   chiffres: [[fmt(D.auc, 2), "AUC en validation croisée", true], [fmt(D.n_carreaux_modele), "carreaux utilisés"]],
   favoris: true, effets: true},
];

// ---------- couches ----------
const lumiere = new LightingEffect({
  ambient: new AmbientLight({color: [255, 255, 255], intensity: 1.0}),
  d1: new DirectionalLight({color: [255, 235, 210], intensity: 1.1, direction: [-3, -9, -4]}),
  d2: new DirectionalLight({color: [160, 190, 255], intensity: 0.6, direction: [4, 6, -2]}),
});
const materiau = {ambient: 0.55, diffuse: 0.6, shininess: 24, specularColor: [60, 64, 70]};
let pulsation = 0;
// L'échelle verticale suit le zoom : vue d'ensemble = relief marqué, vue de rue = tours à taille humaine.
const echelle = z => 2 * Math.pow(2, -(z - 9.5) * 0.55);
const rayonKebab = z => Math.max(18, Math.min(120, 60 * Math.pow(2, (11 - z) * 0.8)));
let zoomDessine = 9;
// --- Mouvement : rames (horloge propre) et piétons (horloge de la marche) ---
const longueurs = trace => {                      // distance cumulée en mètres le long d'un tracé
  const c = [0], k = 111320 * Math.cos(43.3 * Math.PI / 180);
  for (let i = 1; i < trace.length; i++) {
    const dx = (trace[i][0] - trace[i - 1][0]) * k, dy = (trace[i][1] - trace[i - 1][1]) * 111320;
    c.push(c[i - 1] + Math.hypot(dx, dy));
  }
  return c;
};
const CYCLE_RAMES = 3600;                          // secondes simulées, multiple des intervalles
const RAMES = [];
for (const l of D.lignes) {
  const metro = l.type === "subway", v = metro ? 9 : 5.5, h = metro ? 240 : 360;
  for (const trace of [l.trace, [...l.trace].reverse()]) {
    const c = longueurs(trace), duree = c[c.length - 1] / v;
    for (let depart = -Math.ceil(duree / h) * h; depart < CYCLE_RAMES; depart += h)
      RAMES.push({metro, path: trace, ts: c.map(x => depart + x / v)});
  }
}
const PIETONS = D.pietons.map(p => {
  const c = longueurs(p.trace), L = c[c.length - 1] || 1;
  return {...p, ts: c.map(x => p.secondes * x / L)};
});
const DUREE_MARCHE = 30 * 60;                      // on suit les piétons pendant 30 minutes
const tetes = t => PIETONS.map(p => {
  if (t >= p.secondes) return {pos: p.trace[p.trace.length - 1], arrive: true};
  let i = 1; while (i < p.ts.length - 1 && p.ts[i] < t) i++;
  const a = Math.min(1, (t - p.ts[i - 1]) / Math.max(1e-6, p.ts[i] - p.ts[i - 1])), A = p.trace[i - 1], B = p.trace[i];
  return {pos: [A[0] + (B[0] - A[0]) * a, A[1] + (B[1] - A[1]) * a], arrive: false};
});
let horlogeRames = 0, horlogeMarche = 0;
const procheGare = new Set(D.pietons.map(p => p.k));
let atteints = new Set();
const doux = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function couches() {
  const c = etat.couches, proba = etat.relief === "proba", sim = etat.simulation;
  const L = [];
  L.push(new GeoJsonLayer({
    id: "terre", data: D.zones, filled: true, stroked: c.zones, pickable: true,
    getFillColor: [19, 29, 42, 255], getLineColor: [52, 70, 94, 255], lineWidthMinPixels: 0.6,
    autoHighlight: true, highlightColor: [255, 255, 255, 14],
  }));
  if (c.isochrones) L.push(new PolygonLayer({
    id: "iso", data: [...D.isochrones].sort((a, b) => b.minutes - a.minutes), getPolygon: d => d.contour,
    filled: true, stroked: true, pickable: true,
    getFillColor: d => [...LILAS, d.minutes === 5 ? 90 : d.minutes === 10 ? 60 : 38], getLineColor: [...LILAS, 230], lineWidthMinPixels: 1.5,
  }));
  if (c.isochrones && etat.marche) {
    // terrasses du temps : plus on est près de la gare, plus la terrasse est haute
    const ech = echelle(zoomDessine);
    L.push(new PolygonLayer({
      id: "terrasses", data: [...D.isochrones].sort((a, b) => b.minutes - a.minutes), getPolygon: d => d.contour,
      extruded: true, wireframe: true, getElevation: d => (20 - d.minutes) * 9 * ech, pickable: true,
      getFillColor: d => [...LILAS, etat.minute >= d.minutes ? 95 : 22], getLineColor: [...LILAS, 200],
      updateTriggers: {getFillColor: Math.floor(etat.minute / 5)}, material: materiau,
      parameters: {depthMask: false},   // translucides : les piétons restent visibles à travers
    }));
  }
  if (c.rames) {
    L.push(new PathLayer({id: "reseau", data: D.lignes, getPath: d => d.trace, widthMinPixels: 1.5,
      getColor: d => d.type === "subway" ? [233, 237, 243, 70] : [159, 216, 255, 70]}));
    L.push(new TripsLayer({id: "rames", data: RAMES, getPath: d => d.path, getTimestamps: d => d.ts,
      getColor: d => d.metro ? [242, 245, 255] : [159, 216, 255], widthMinPixels: 4, capRounded: true, jointRounded: true,
      fadeTrail: true, trailLength: 75, currentTime: horlogeRames % CYCLE_RAMES}));
  }
  if (c.pietons && etat.marche) {
    L.push(new TripsLayer({id: "pietons", data: PIETONS, getPath: d => d.trace, getTimestamps: d => d.ts,
      getColor: [255, 236, 200], widthMinPixels: 4, capRounded: true, jointRounded: true, fadeTrail: true, trailLength: 180, currentTime: horlogeMarche}));
    L.push(new ScatterplotLayer({id: "tetes", data: tetes(Math.min(horlogeMarche, DUREE_MARCHE)), getPosition: d => d.pos,
      getRadius: 14, radiusMinPixels: 5, stroked: true, getLineColor: [10, 17, 27, 255], lineWidthMinPixels: 1,
      getFillColor: d => d.arrive ? [...BRAISE, 255] : [255, 250, 235, 255]}));
  }
  if (c.rates) L.push(new ScatterplotLayer({
    id: "rates", data: D.rates, getPosition: d => [d.lon, d.lat, 40], pickable: true, getRadius: 260, radiusMinPixels: 7,
    stroked: true, filled: true, getFillColor: [255, 93, 93, 45], getLineColor: [255, 93, 93, 255], lineWidthMinPixels: 2.5,
  }));
  if (c.carreaux) L.push(new ColumnLayer({
    id: "carreaux", data: D.carreaux, diskResolution: 4, angle: 45, radius: 128, coverage: 0.92,
    extruded: true, pickable: true, material: materiau,
    getPosition: d => [d[0], d[1]],
    getElevation: d => proba ? (d[5] ?? 0) * 2600 : d[2],
    elevationScale: (proba ? 2.2 : 1) * echelle(zoomDessine),
    getFillColor: d => proba ? couleurProba(d[5]) : couleurNiveauVie(d[3]),
    updateTriggers: {getElevation: proba, getFillColor: proba},
    transitions: reduit ? {} : {getElevation: 900, getFillColor: 600},
  }));
  if (c.arcs && !sim) L.push(new ArcLayer({
    id: "arcs", data: D.kebabs, getSourcePosition: d => [d.lon, d.lat], getTargetPosition: d => [d.st_lon, d.st_lat],
    getSourceColor: [...BRAISE, 255], getTargetColor: [233, 237, 243, 220], getWidth: 2, getHeight: 0.6,
  }));
  if (c.stations) L.push(new ScatterplotLayer({
    id: "stations", data: D.stations, getPosition: d => [d.lon, d.lat, 6], pickable: true,
    getRadius: d => (d.type === "train" ? 1.6 : 1) * 0.9 * rayonKebab(zoomDessine), radiusMinPixels: 2.5, stroked: true, filled: true,
    getFillColor: d => d.type === "train" ? [233, 237, 243, 255] : [233, 237, 243, 150], getLineColor: [10, 17, 27, 255], lineWidthMinPixels: 1,
  }));
  if (c.favoris) {
    const r = reduit ? 1 : 0.75 + 0.35 * Math.sin(pulsation);
    L.push(new ScatterplotLayer({
      id: "favoris", data: D.opportunites, pickable: true,
      // l'anneau flotte au sommet de la colonne du carreau (ou au sol en mode « Habitants »)
      getPosition: d => [d.lon, d.lat, (proba && c.carreaux ? d.proba * 2600 * 2.2 * echelle(zoomDessine) : 0) + 40],
      getRadius: 230 * r, radiusMinPixels: 6, stroked: true, filled: true,
      getFillColor: [...POUSSE, 40], getLineColor: [...POUSSE, 255], lineWidthMinPixels: 2,
      updateTriggers: {getRadius: r, getPosition: [proba, c.carreaux, Math.round(zoomDessine * 8)]},
    }));
  }
  if (c.kebabs) {
    const pos = d => sim ? [d.sim_lon, d.sim_lat] : [d.lon, d.lat];
    const tr = reduit ? {} : {getPosition: {duration: 2200, easing: doux}};
    L.push(new ScatterplotLayer({
      id: "halo", data: D.kebabs, getPosition: pos, getRadius: 2.6 * rayonKebab(zoomDessine), radiusMinPixels: 5,
      getFillColor: sim ? [233, 237, 243, 60] : [...BRAISE, 80], updateTriggers: {getPosition: sim, getFillColor: sim}, transitions: tr,
    }));
    L.push(new ColumnLayer({
      id: "kebabs", data: D.kebabs, diskResolution: 12, radius: rayonKebab(zoomDessine), extruded: true, pickable: true, material: materiau,
      getPosition: pos, getElevation: d => d.fiab === "certain" ? 3000 : 2200, elevationScale: echelle(zoomDessine) * (etat.marche ? 0.22 : 1),
      getFillColor: (d, {index}) => sim ? [233, 237, 243, 235]
        : etat.marche ? (atteints.has(index) ? [...BRAISE, 255] : (procheGare.has(index) ? [120, 96, 60, 220] : [...BRAISE, 90]))
        : d.fiab === "certain" ? [...BRAISE, 255] : [255, 210, 140, 235],
      updateTriggers: {getPosition: sim, getFillColor: [sim, etat.marche, atteints.size]}, transitions: tr,
    }));
  }
  return L;
}

// ---------- bulles d'information ----------
const echap = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
function bulle({layer, object}) {
  if (!object || !layer) return null;
  let h = "";
  if (layer.id === "kebabs") {
    h = etat.simulation ? `<b>Kebab fictif</b><br><span class="m">placé au hasard selon la population</span>` :
      `<b>${echap(object.nom)}</b><br>${echap(object.commune)}${object.arr ? `, ${object.arr}<sup>e</sup> arr.` : ""}` +
      `<br><span class="m">${object.fiab === "certain" ? "kebab certain" : "kebab probable"} · source ${object.src.replace("+", " + ")}</span>` +
      `<br><span class="m">${fmt(object.st_m)} m de ${echap(object.st)}</span>`;
  } else if (layer.id === "carreaux") {
    const [, , pop, nv, k, p, dg] = object;
    h = `<b>Carreau de 200 m</b><br>${fmt(pop)} habitants` + (nv ? `<br>niveau de vie moyen ${fmt(nv)} €/an` : "") +
      `<br><span class="m">${k ? `${k} kebab${k > 1 ? "s" : ""}` : "aucun kebab connu"}` +
      (p != null ? ` · modèle : ${fmt(100 * p, 1)} %` : "") + (dg != null ? `<br>station à ${fmt(dg)} m` : "") + `</span>`;
  } else if (layer.id === "stations") {
    h = `<b>${echap(object.nom)}</b><br><span class="m">${({train: "gare", metro: "métro", tram: "tram"})[object.type] ?? object.type}</span>`;
  } else if (layer.id === "favoris") {
    h = `<b>Emplacement favorable</b><br>${echap(object.zone)}<br><span class="m">probabilité ${fmt(100 * object.proba, 0)} % · ${fmt(object.pop)} hab.` +
      `<br>station à ${fmt(object.station_m)} m</span>`;
  } else if (layer.id === "rates") {
    h = `<b>Raté du modèle</b><br>${echap(object.zone)}<br><span class="m">un kebab existe, mais le modèle ne lui donnait que ${fmt(100 * object.proba, 2)} %` +
      `<br>(${fmt(object.rang)}e carreau sur ${fmt(D.n_carreaux_modele)})</span>`;
  } else if (layer.id === "iso" || layer.id === "terrasses") {
    h = `<b>${object.minutes} min à pied</b><br><span class="m">depuis la gare Saint-Charles</span>`;
  } else if (layer.id === "terre") {
    const p = object.properties, n = p.nb_kebabs ?? 0;
    h = `<b>${echap(p.nom_zone)}</b><br>${fmt(p.population)} habitants<br><span class="m">${n} kebab${n > 1 ? "s" : ""}` +
      (n ? ` · ${fmt(p.kebabs_pour_10000_hab, 1)} pour 10 000 hab.` : "") + `</span>`;
  }
  return {html: `<div class="bulle">${h}</div>`, style: {background: "rgba(13,21,32,.95)", color: "#e9edf3",
    border: "1px solid #2a3a4f", borderRadius: "8px", padding: "8px 10px", maxWidth: "260px"}};
}

// ---------- scène ----------
let vue = {...ETAPES[0].vue, maxPitch: 75, minZoom: 7.5, maxZoom: 17};
zoomDessine = vue.zoom;
const scene = new DeckGL({
  container: "scene", initialViewState: vue, controller: {inertia: true}, effects: [lumiere],
  layers: couches(), getTooltip: bulle, parameters: {clearColor: [10 / 255, 17 / 255, 27 / 255, 1]},
  onViewStateChange: ({viewState, interactionState}) => {
    vue = viewState;
    if (Math.abs(viewState.zoom - zoomDessine) > 0.12) { zoomDessine = viewState.zoom; redessiner(); }
    if (interactionState && (interactionState.isDragging || interactionState.isZooming || interactionState.isRotating)) arreterRotation();
    return viewState;
  },
});
const redessiner = () => scene.setProps({layers: couches()});
function voler(v, duree = 2600) {
  vue = {...vue, ...v, transitionDuration: reduit ? 0 : duree, transitionInterpolator: new FlyToInterpolator({speed: 1.4})};
  scene.setProps({initialViewState: vue});
}
function arreterRotation() {
  if (!etat.tourne) return;
  etat.tourne = false; $("#tourner").setAttribute("aria-pressed", "false"); $("#tourner").textContent = "Tourner";
}

// rotation lente et pulsation des emplacements favorables
let derniere = performance.now();
function boucle(t) {
  const dt = Math.min(64, t - derniere); derniere = t;
  if (etat.tourne && !reduit) {
    vue = {...vue, bearing: (vue.bearing ?? 0) + dt * 0.006, transitionDuration: 0};
    scene.setProps({initialViewState: vue});
  }
  let anime = false;
  if (etat.couches.favoris && !reduit) { pulsation += dt * 0.004; anime = true; }
  if (etat.couches.rames && !reduit && !document.hidden) { horlogeRames += dt * 0.04; anime = true; }   // temps x40
  if (etat.marche && etat.couches.pietons && !document.hidden) {
    horlogeMarche += dt * (reduit ? 0 : 0.075);                                                        // temps x75
    if (reduit) horlogeMarche = DUREE_MARCHE;                                                          // état final, sans animation
    if (horlogeMarche > DUREE_MARCHE + 240) { horlogeMarche = 0; atteints = new Set(); }                // courte pause, puis on repart
    const t = Math.min(horlogeMarche, DUREE_MARCHE);
    etat.minute = t / 60;
    for (const p of PIETONS) if (t >= p.secondes) atteints.add(p.k);
    $("#h-min").textContent = String(Math.floor(etat.minute)).padStart(2, "0");
    $("#h-keb").textContent = atteints.size;
    $("#h-barre").style.width = `${Math.min(100, 100 * t / (25 * 60))}%`;
    anime = true;
  }
  if (anime) redessiner();
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);

// ---------- interface ----------
$("#couches").innerHTML = COUCHES.map(([k, l, c]) =>
  `<label><input type="checkbox" id="c-${k}" data-c="${k}"><span class="pastille" style="background:${c}"></span>${l}</label>`).join("");
$("#couches").addEventListener("change", e => { etat.couches[e.target.dataset.c] = e.target.checked; redessiner(); });
function majCouches() { for (const [k] of COUCHES) $(`#c-${k}`).checked = etat.couches[k]; }

function majLegende() {
  $("#legende").innerHTML = etat.relief === "pop"
    ? `<div class="degrade" style="background:linear-gradient(90deg,#e0487f,#7d8aa0,#3cc4d4)"></div>
       <div class="bornes"><span>14 000 €</span><span>22 000 €</span><span>34 000 €</span></div>
       <p>Couleur : niveau de vie moyen par an. Hauteur : habitants du carreau.</p>`
    : `<div class="degrade" style="background:linear-gradient(90deg,#1d2a46,#8fa8ff 70%,#f2f5ff)"></div>
       <div class="bornes"><span>0 %</span><span>35 % et plus</span></div>
       <p>Hauteur et couleur : probabilité qu'un carreau abrite un kebab selon le modèle. Les carreaux dont les revenus sont estimés par l'Insee ne sont pas modélisés.</p>`;
}
function relief(r) {
  etat.relief = r;
  $("#h-pop").setAttribute("aria-pressed", r === "pop"); $("#h-proba").setAttribute("aria-pressed", r === "proba");
  majLegende(); redessiner();
}
$("#h-pop").onclick = () => relief("pop");
$("#h-proba").onclick = () => relief("proba");
$("#tourner").onclick = () => {
  etat.tourne = !etat.tourne; $("#tourner").setAttribute("aria-pressed", etat.tourne);
  $("#tourner").textContent = etat.tourne ? "Arrêter" : "Tourner";
};
$("#vue").onclick = () => voler(ETAPES[0].vue);
$("#ouvrir-console").onclick = () => $("#console").classList.toggle("ouverte");
$("#replier").onclick = () => {
  const r = $("#carnet").classList.toggle("replie");
  $("#replier").textContent = r ? "Lire" : "Réduire"; $("#replier").setAttribute("aria-expanded", !r);
};
const mq = window.matchMedia("(max-width: 760px)");
const majMobile = () => { $("#ouvrir-console").style.display = mq.matches ? "inline-block" : "none"; };
mq.addEventListener("change", majMobile); majMobile();

// simulation
function histogramme() {
  const W = 520, H = 92, g = 34, d = 16, b = 24, h = S.histo_station, bords = S.histo_bords;
  const xmax = Math.ceil(Math.max(...bords) / 250) * 250, x = v => g + (W - g - d) * v / xmax;
  const ymax = Math.max(...h), y = v => H - b - (H - b - 18) * v / ymax;
  let s = `<line x1="${g}" x2="${W - d}" y1="${H - b}" y2="${H - b}" stroke="#2a3a4f"/>`;
  h.forEach((v, i) => { s += `<rect x="${x(bords[i])}" y="${y(v)}" width="${Math.max(1, x(bords[i + 1]) - x(bords[i]) - 1)}" height="${H - b - y(v)}" fill="#7d8aa0"/>`; });
  for (let t = 0; t <= xmax; t += 250) s += `<text x="${x(t)}" y="${H - b + 13}" text-anchor="middle">${fmt(t)}</text>`;
  const xr = x(S.reel.station_mediane_m);
  s += `<line x1="${xr}" x2="${xr}" y1="8" y2="${H - b}" stroke="#ffb23e" stroke-width="2"/>`;
  s += `<text x="${xr + 6}" y="18" style="fill:#ffb23e">vrais kebabs : ${fmt(S.reel.station_mediane_m)} m</text>`;
  s += `<text x="${x(S.sim_mediane.station_mediane_m)}" y="10" text-anchor="middle">${fmt(S.n)} tirages au hasard</text>`;
  s += `<text x="${W - d}" y="${H - 1}" text-anchor="end">distance médiane kebab → station (m)</text>`;
  $("#histo").innerHTML = s;
}
function majSimu() {
  $("#lancer").textContent = etat.simulation ? "Revenir aux vrais kebabs" : "Placer les kebabs comme la population";
  $("#etat-simu").innerHTML = etat.simulation
    ? `Au hasard : <b>${fmt(S.sim_mediane.station_mediane_m)} m</b> d'une station en médiane, ${fmt(100 * S.sim_mediane.part_500m_station)} % à moins de 500 m.`
    : `En réalité : <b>${fmt(S.reel.station_mediane_m)} m</b> d'une station en médiane, ${fmt(100 * S.reel.part_500m_station)} % à moins de 500 m.`;
}
$("#lancer").onclick = () => { etat.simulation = !etat.simulation; majSimu(); redessiner(); };
histogramme(); majSimu();

// récit
let courante = 0;
$("#points").innerHTML = ETAPES.map((e, i) => `<button type="button" aria-label="Étape ${i + 1} : ${e.titre}" data-i="${i}"></button>`).join("");
$("#points").onclick = e => { if (e.target.dataset.i) aller(+e.target.dataset.i); };
$("#prec").onclick = () => aller(courante - 1);
$("#suiv").onclick = () => aller(courante + 1);
document.addEventListener("keydown", e => {
  if (e.target.closest("input")) return;
  if (e.key === "ArrowRight") aller(courante + 1);
  if (e.key === "ArrowLeft") aller(courante - 1);
});

function effetsHtml() {
  const lg = v => Math.log(v) / Math.log(4);  // échelle log : ×1/4 à gauche, ×4 à droite
  const pos = v => 50 + 50 * Math.max(-1, Math.min(1, lg(v)));
  return `<div class="effets">${D.effets.map(e => {
    const a = pos(e.bas), b = pos(e.haut), c = e.p >= 0.05 ? "#4a5568" : e.or > 1 ? "#ffb23e" : "#3cc4d4";
    return `<div class="effet"><span>${e.libelle}</span><span class="barre"><i style="left:${a}%;width:${Math.max(1.5, b - a)}%;background:${c}"></i></span><span class="v">×${fmt(e.or, 2)}</span></div>`;
  }).join("")}</div><p style="font-size:12px;color:var(--texte-2)">Effet d'une hausse d'un écart-type, toutes choses égales par ailleurs (intervalle à 95 %, échelle logarithmique de ×¼ à ×4). Doré : augmente les chances d'un kebab ; bleu : les diminue ; gris : non significatif.</p>`;
}
function favorisHtml() {
  return `<p style="margin-top:4px"><b style="font-weight:600">Les plus favorables sans kebab connu</b> (cliquez pour y aller)</p><ul class="favoris">${D.opportunites.slice(0, 6).map((o, i) =>
    `<li><button type="button" data-o="${i}"><span>${echap(o.zone)}</span><span class="p">${fmt(100 * o.proba, 0)} %</span></button></li>`).join("")}</ul>`;
}

function aller(i) {
  if (i < 0 || i >= ETAPES.length) return;
  courante = i;
  const e = ETAPES[i];
  arreterRotation();
  $("#etape").innerHTML = `<div class="num">Étape ${i + 1} sur ${ETAPES.length}</div><h2>${e.titre}</h2>` +
    `<div class="chiffres">${e.chiffres.map(([v, l, ch]) => `<div class="chiffre${ch ? " chaud" : ""}"><b>${v}</b><span>${l}</span></div>`).join("")}</div>` +
    e.texte.map(t => `<p>${t}</p>`).join("") + (e.favoris ? favorisHtml() : "") + (e.effets ? effetsHtml() : "");
  $("#etape").scrollTop = 0;
  $("#etape").querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
    const o = D.opportunites[+b.dataset.o];
    voler({longitude: o.lon, latitude: o.lat, zoom: 15, pitch: 60, bearing: vue.bearing ?? 0}, 2200);
  });
  Object.assign(etat.couches, e.couches);
  if (!e.simu && etat.simulation) { etat.simulation = false; majSimu(); }
  $("#simu").classList.toggle("visible", !!e.simu);
  etat.marche = !!e.marche;
  $("#horloge").hidden = !e.marche;
  $("#h-tot").textContent = D.pietons.length;
  if (e.marche) { horlogeMarche = 0; atteints = new Set(); etat.minute = 0; }
  majCouches(); relief(e.relief);
  voler(e.vue);
  if (e.tourne && !reduit) setTimeout(() => {
    if (courante !== i) return;
    etat.tourne = true; $("#tourner").setAttribute("aria-pressed", "true"); $("#tourner").textContent = "Arrêter";
  }, 2800);
  $("#prec").disabled = i === 0;
  $("#suiv").disabled = i === ETAPES.length - 1;
  $("#points").querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-current", j === i));
}
aller(0);
// accès pour les tests automatiques : avancer l'horloge de la marche (en secondes simulées)
window.scene3d = {avancer: s => { horlogeMarche = s; }};
})();
</script>
